# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - gen13-app-step3-1-281-fe

on:
  push:
    branches:
      - 'main'
    # 【手順書3.4】#1: pathsを追加。teamXX-webを実際の名称に変更。
    paths:
      - 'giftia-frontend/**'
      - '.github/workflows/main_gen13-app-step3-1-281-fe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    # 【手順書3.4】#2: defaultsを追加
    defaults:
      run:
        working-directory: giftia-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        # 【手順書3.4】#3: envを追加
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      # 【手順書3.4】#4: Zip artifact...を追加
      - name: Zip artifact for deployment
        run: zip -qr ../release.zip . -x '.next/cache/*'


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # 【手順書3.4】#6: pathを変更
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gen13-app-step3-1-281-fe'
          slot-name: 'Production'
          # 【手順書3.4】#5: release.zipに変更
          package: release.zip
          clean: true  # 【追加】新しいZIPを展開する前にデプロイ先フォルダーの既存ファイルを削除する
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_39C649329FDF475593E3E042654B6C0D }}